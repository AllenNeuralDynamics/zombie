# supervisord.conf — manages all processes inside the container.
#
# Processes:
#   nginx         — reverse proxy on :8000 (see deploy/nginx.conf)
#   docdb-proxy   — DocDB REST proxy on :3001 (127.0.0.1 only)

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:docdb-proxy]
# HTTP proxy on :3001 for DocDB, S3 listing, and log-server requests.
command=/usr/local/bin/python /app/web/docdb_proxy.py
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

