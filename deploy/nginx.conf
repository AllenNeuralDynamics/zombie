# ZOMBIE nginx configuration
#
# Listens on :8000 (the single port exposed by the container).
#
# Routes:
#   /             → index.html          (main data explorer)
#   /search       → search.html         (asset search / table)
#   /view         → view.html           (asset viewer: subject + project)
#   /contributions→ contributions.html  (CReDIT landing page)
#   /contributions/view → contributions/view.html (read-only preview)
#   /contributions/edit → contributions/edit.html (admin editor)
#   /contributions/add  → contributions/add.html  (self-service wizard)
#   /analysis-framework → analysis-framework.html  (AIND analysis framework viz)
#   /size               → size.html                 (storage sizes table)
#   /smartspim          → smartspim.html          (SmartSPIM assets)
#   /exaspim            → exaspim.html            (ExaSPIM assets)
#   /fiber_photometry   → fiber_photometry.html   (Fiber Photometry Platform)
#   /vr_foraging        → vr_foraging.html        (VR Foraging Platform)
#   /dynamic_foraging   → dynamic_foraging.html   (Dynamic Foraging Platform)
#   /dynamic_routing    → dynamic_routing.html    (Dynamic Routing Platform)
#   /slap2              → slap2.html              (SLAP2 Platform)
#   /sessions           → sessions.html           (behavioral sessions)
#   /names              → names.html              (hidden: name normalization graph)
#   /record             → record.html             (hidden: metadata JSON viewer)
#   /star               → star.html               (hidden: STAR Methods table)
#   /upgrade            → upgrade.html            (hidden: metadata upgrade status)
#   /migrate            → migrate.html            (redirect to /migrate/submit)
#   /migrate/submit     → migrate/submit.html     (hidden: first-actor migration tool)
#   /migrate/review     → migrate/review.html     (hidden: second-actor reviewer queue)
#   /v2                 → v2.html                 (hidden: v2 acquisition heatmap)
#   /subject            → redirect to /view          (legacy endpoint)
#   /project            → redirect to /view          (legacy endpoint)
#
# Each page has its own entry point so pages that don't need DuckDB/httpfs
# can load independently.
#
# Static asset caching:
#   /assets/*  → Vite hashed JS/CSS: immutable, 1yr cache
#   /fonts/*, /icons/*, /images/*, /ng/* → unhashed public files: 1 day cache
#   HTML routes (all of the above) → Cache-Control: no-cache (must revalidate)

server {
    listen 8000;
    server_name _;

    # Re-resolve upstream DNS at request time. Without this, proxy_pass to a
    # literal hostname caches the resolved IP for the life of the worker
    # process; when an upstream behind an ALB/CloudFront rotates its IPs the
    # cached address goes stale, producing intermittent 504s (dead IP) and
    # 403s (IP reassigned to another service). The external-hostname proxy
    # blocks below use a variable in proxy_pass so nginx honors this resolver
    # per request. 169.254.169.253 is AmazonProvidedDNS (VPC resolver).
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ------------------------------------------------------------------
    # Compression for text-based responses. HTML is gzipped by nginx's
    # built-in default gzip_types regardless of the list below.
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ------------------------------------------------------------------
    # aind-metadata-viz contributions + auth API proxy
    # Strips /metadata-viz prefix and forwards to the FastAPI service.
    # Handles contributions (/contributions/*) and ORCID auth (/auth/*).
    #
    # ORCID login: the backend sets a session cookie scoped to the shared
    # parent domain (SESSION_COOKIE_DOMAIN=.allenneuraldynamics.org), so it is
    # sent to both data.* (this frontend, via this proxy) and metadata-portal.*
    # (the backend, where the OAuth callback lands). Register the ORCID app
    # redirect URI as https://metadata-portal.allenneuraldynamics.org/auth/orcid/callback
    # and set the backend's PUBLIC_BASE_URL to that host. No cookie rewriting
    # is needed because the cookie domain is explicit.
    # ------------------------------------------------------------------
    location /metadata-viz/ {
        set $mviz_upstream metadata-portal.allenneuraldynamics.org;
        rewrite ^/metadata-viz/(.*)$ /$1 break;
        proxy_pass         https://$mviz_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     metadata-portal.allenneuraldynamics.org;
        proxy_set_header   Host             metadata-portal.allenneuraldynamics.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Metadata portal upgrade API proxy
    # Strips /metadata-portal prefix and forwards to the portal service.
    # ------------------------------------------------------------------
    location /metadata-portal/ {
        set $mportal_upstream metadata-portal.allenneuraldynamics.org;
        rewrite ^/metadata-portal/(.*)$ /$1 break;
        proxy_pass         https://$mportal_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     metadata-portal.allenneuraldynamics.org;
        proxy_set_header   Host             metadata-portal.allenneuraldynamics.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # Janelia MouseLight API proxy (ExaSPIM morphology viewer).
    # The browser can't call ml-neuronbrowser.janelia.org directly — its
    # /tracings endpoint omits CORS headers. Strips /mouselight prefix and
    # forwards /graphql + /tracings to the Janelia host.
    # ------------------------------------------------------------------
    location /mouselight/ {
        set $mouselight_upstream ml-neuronbrowser.janelia.org;
        rewrite ^/mouselight/(.*)$ /$1 break;
        proxy_pass         https://$mouselight_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     ml-neuronbrowser.janelia.org;
        proxy_set_header   Host             ml-neuronbrowser.janelia.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # Eng-tools MySQL log server proxy.
    # Forwards /log-server/<path> → docdb_proxy.py, which connects to
    # the internal eng-logtools MySQL on :3306. Credentials are sent in
    # the POST body; nothing is cached server-side.
    # ------------------------------------------------------------------
    location /log-server/ {
        proxy_pass         http://127.0.0.1:3001/log-server/;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Analysis-framework S3 object-listing proxy.
    # /s3-list → docdb_proxy.py (public S3 prefix image listing).
    # The DocDB query itself is made directly from the browser (that API is
    # public + CORS); only S3 listing needs proxying (buckets have no CORS).
    # ------------------------------------------------------------------
    location /s3-list {
        proxy_pass         http://127.0.0.1:3001/s3-list;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Strip trailing slashes — redirect /foo/ → /foo (301).
    # ------------------------------------------------------------------
    rewrite ^(.+)/$ $1 permanent;

    # ------------------------------------------------------------------
    # Static files — each route maps to its own HTML page.
    # ------------------------------------------------------------------
    root /app/web/dist;
    index index.html;

    # ------------------------------------------------------------------
    # Vite emits hashed filenames under /assets/ — safe to cache for a
    # year since a new build always produces new filenames.
    # ------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ------------------------------------------------------------------
    # Unhashed public static files (fonts, icons, images, prebuilt
    # Neuroglancer bundle). These can change in place on redeploy, so use
    # a moderate TTL rather than immutable caching.
    # ------------------------------------------------------------------
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /ng/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /subject {
        return 301 /view$is_args$args;
    }

    location = /project {
        return 301 /view$is_args$args;
    }

    location = /search {
        try_files /search.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /view {
        try_files /view.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /contributions {
        try_files /contributions.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /contributions/view {
        try_files /contributions/view.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /contributions/edit {
        try_files /contributions/edit.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /contributions/add {
        try_files /contributions/add.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /smartspim {
        try_files /smartspim.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /exaspim {
        try_files /exaspim.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /coordinate-system-builder {
        try_files /coordinate_system_builder.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }
    
    location = /sessions {
        try_files /sessions.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /quality_control {
        try_files /quality_control.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /fiber_photometry {
        try_files /fiber_photometry.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /vr_foraging {
        try_files /vr_foraging.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /dynamic_foraging {
        try_files /dynamic_foraging.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /dynamic_routing {
        try_files /dynamic_routing.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /slap2 {
        try_files /slap2.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /names {
        try_files /names.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /record {
        try_files /record.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /star {
        try_files /star.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /upgrade {
        try_files /upgrade.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /size {
        try_files /size.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /migrate {
        try_files /migrate.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /migrate/submit {
        try_files /migrate/submit.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /migrate/review {
        try_files /migrate/review.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /v2 {
        try_files /v2.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location = /analysis-framework {
        try_files /analysis-framework.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/html-cache.conf;
    }
}
