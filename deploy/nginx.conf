# ZOMBIE nginx configuration
#
# Listens on :8000 (the single port exposed by the container).
#
# Routing:
#   Page routes are NOT individually listed here. `web/build/routes.js` is
#   the single source of truth for which pages exist; as long as a page's
#   route matches its HTML filename (minus the extension — e.g. `/search` →
#   `search.html`, `/contributions/view` → `contributions/view.html`), the
#   generic `location /` block below resolves it automatically: try the
#   literal path, then its `.html` form, else 404 (no SPA fallback — this is
#   a multi-page app, and index.html is only the `/search` redirect page).
#
#   Explicit `location` blocks remain only for routes that don't fit that
#   generic rule:
#     - API/proxy routes (metadata-viz, metadata-portal, mouselight,
#       log-server, s3-list).
#     - Legacy `/subject` and `/project` redirects to `/view`.
#     - `/` itself, which must resolve to `index.html` specifically.
#
# Each page has its own Vite entry point so pages that don't need
# DuckDB/httpfs can load independently.
#
# Static asset caching:
#   /assets/*  → Vite hashed JS/CSS: immutable, 1yr cache
#   /fonts/*, /icons/*, /images/*, /ng/* → unhashed public files: 1 day cache
#   HTML routes (all of the above) → Cache-Control: no-cache (must revalidate)


server {
    listen 8000;
    server_name _;

    # Re-resolve upstream DNS at request time. Without this, proxy_pass to a
    # literal hostname caches the resolved IP for the life of the worker
    # process; when an upstream behind an ALB/CloudFront rotates its IPs the
    # cached address goes stale, producing intermittent 504s (dead IP) and
    # 403s (IP reassigned to another service). The external-hostname proxy
    # blocks below use a variable in proxy_pass so nginx honors this resolver
    # per request. 169.254.169.253 is AmazonProvidedDNS (VPC resolver).
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ------------------------------------------------------------------
    # Compression for text-based responses. HTML is gzipped by nginx's
    # built-in default gzip_types regardless of the list below.
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ------------------------------------------------------------------
    # aind-metadata-viz contributions + auth API proxy
    # Strips /metadata-viz prefix and forwards to the FastAPI service.
    # Handles contributions (/contributions/*) and ORCID auth (/auth/*).
    #
    # ORCID login: the backend sets a session cookie scoped to the shared
    # parent domain (SESSION_COOKIE_DOMAIN=.allenneuraldynamics.org), so it is
    # sent to both data.* (this frontend, via this proxy) and metadata-portal.*
    # (the backend, where the OAuth callback lands). Register the ORCID app
    # redirect URI as https://metadata-portal.allenneuraldynamics.org/auth/orcid/callback
    # and set the backend's PUBLIC_BASE_URL to that host. No cookie rewriting
    # is needed because the cookie domain is explicit.
    # ------------------------------------------------------------------
    location /metadata-viz/ {
        set $mviz_upstream metadata-portal.allenneuraldynamics.org;
        rewrite ^/metadata-viz/(.*)$ /$1 break;
        proxy_pass         https://$mviz_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     metadata-portal.allenneuraldynamics.org;
        proxy_set_header   Host             metadata-portal.allenneuraldynamics.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Metadata portal upgrade API proxy
    # Strips /metadata-portal prefix and forwards to the portal service.
    # ------------------------------------------------------------------
    location /metadata-portal/ {
        set $mportal_upstream metadata-portal.allenneuraldynamics.org;
        rewrite ^/metadata-portal/(.*)$ /$1 break;
        proxy_pass         https://$mportal_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     metadata-portal.allenneuraldynamics.org;
        proxy_set_header   Host             metadata-portal.allenneuraldynamics.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # Janelia MouseLight API proxy (ExaSPIM morphology viewer).
    # The browser can't call ml-neuronbrowser.janelia.org directly — its
    # /tracings endpoint omits CORS headers. Strips /mouselight prefix and
    # forwards /graphql + /tracings to the Janelia host.
    # ------------------------------------------------------------------
    location /mouselight/ {
        set $mouselight_upstream ml-neuronbrowser.janelia.org;
        rewrite ^/mouselight/(.*)$ /$1 break;
        proxy_pass         https://$mouselight_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name     ml-neuronbrowser.janelia.org;
        proxy_set_header   Host             ml-neuronbrowser.janelia.org;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------------
    # Eng-tools MySQL log server proxy.
    # Forwards /log-server/<path> → docdb_proxy.py, which connects to
    # the internal eng-logtools MySQL on :3306. Credentials are sent in
    # the POST body; nothing is cached server-side.
    # ------------------------------------------------------------------
    location /log-server/ {
        proxy_pass         http://127.0.0.1:3001/log-server/;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Analysis-framework S3 object-listing proxy.
    # /s3-list → docdb_proxy.py (public S3 prefix image listing).
    # The DocDB query itself is made directly from the browser (that API is
    # public + CORS); only S3 listing needs proxying (buckets have no CORS).
    # ------------------------------------------------------------------
    location /s3-list {
        proxy_pass         http://127.0.0.1:3001/s3-list;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Strip trailing slashes — redirect /foo/ → /foo (301).
    # ------------------------------------------------------------------
    rewrite ^(.+)/$ $1 permanent;

    # ------------------------------------------------------------------
    # Static files — each route maps to its own HTML page.
    # ------------------------------------------------------------------
    root /app/web/dist;
    index index.html;

    # ------------------------------------------------------------------
    # Vite emits hashed filenames under /assets/ — safe to cache for a
    # year since a new build always produces new filenames.
    # ------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ------------------------------------------------------------------
    # Unhashed public static files (fonts, icons, images, prebuilt
    # Neuroglancer bundle). These can change in place on redeploy, so use
    # a moderate TTL rather than immutable caching.
    # ------------------------------------------------------------------
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /ng/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /subject {
        return 301 /view$is_args$args;
    }

    location = /project {
        return 301 /view$is_args$args;
    }

    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }

    # ------------------------------------------------------------------
    # Generic static-page resolution for every other route: try the literal
    # path, then its `.html` form, otherwise 404. This covers all pages
    # listed in web/build/routes.js (including nested ones, e.g.
    # /contributions/view → contributions/view.html) with no per-page
    # config, as long as a page's route matches its HTML filename minus the
    # extension. No fallback to index.html — unknown routes must 404 rather
    # than silently rendering an unrelated page.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri.html =404;
        include /etc/nginx/snippets/html-cache.conf;
    }
}

