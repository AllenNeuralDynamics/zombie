# Shared Cache-Control header for HTML routes.
#
# HTML must always revalidate so clients discover new deployments right
# away. Vite's content-hashed filenames handle cache-busting for JS/CSS/etc,
# so HTML itself never needs a long TTL. Included from each HTML-serving
# location block in nginx.conf (kept out of conf.d/ so it isn't
# auto-included at the http level, which would also add this header to
# proxied/API responses).
add_header Cache-Control "no-cache" always;
